name: tests

# This package is checked out at `package/` and its dependencies at `packages/*`, because the
# Composer `path` repositories in composer.json are written relative to the package root
# (`../packages/<dep>`). That is the same shape testing13 mounts in Docker, so the lock file and
# the vendor symlinks resolve unchanged.

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package
    env:
      # The package suite runs on an in-memory SQLite database; the MariaDB service below only
      # serves the mariadb group.
      XDEBUG_MODE: off

    services:
      db:
        image: mariadb:11.7
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laravel_phpunit
          MARIADB_USER: laravel
          MARIADB_PASSWORD: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: package

      # Sibling packages are checked out on the branch that triggered this run when they have it
      # (a push to develop tests develop against develop), and on their default branch otherwise.
      - name: Pick the packages' branch
        id: siblings
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in basics13 entities13 projects13; do
            if git ls-remote --exit-code --heads "https://github.com/amaiagalvez/$repo.git" "$BRANCH" > /dev/null 2>&1; then
              echo "$repo=$BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout basics13
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/basics13
          ref: ${{ steps.siblings.outputs['basics13'] }}
          path: packages/basics13

      - name: Checkout entities13
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/entities13
          ref: ${{ steps.siblings.outputs['entities13'] }}
          path: packages/entities13

      - name: Checkout projects13
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/projects13
          ref: ${{ steps.siblings.outputs['projects13'] }}
          path: packages/projects13

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('package/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Same three checks testing13 runs locally: reformat.sh, review.sh, phpunit.sh.
      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      # Browser suites (tests/Browser) are deliberately absent: they need a running application
      # and run in demo13, whose phpunit.dusk.xml collects them through vendor/amaia/*/tests/Browser.
      - name: Run tests
        run: vendor/bin/phpunit

      # The tests that need MariaDB itself, #[Group('mariadb')]: the unique active-name index and its
      # collation, and the row locks behind the delete and restore guards. SQLite runs the rest.
      - name: Run MariaDB tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_phpunit
          DB_USERNAME: laravel
          DB_PASSWORD: laravel
          DB_URL: ''
          BASICS13_MARIADB_DATABASE: laravel_phpunit
        run: vendor/bin/phpunit --group mariadb
